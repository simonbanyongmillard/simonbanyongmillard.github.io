<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Banyong Millard | Game Developer</title>

    <meta name="description"
          content="Portfolio of Simon Banyong Millard, Game Developer, Gameplay Programmer and IT Consultant.">

    <meta name="theme-color" content="#10141c">

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header class="header">

            <div class="identity-label">
                GAME DEVELOPMENT / SOFTWARE ENGINEERING
            </div>
        
            <div class="header-content">

                <img
                    src="assets/portrait/profile.jpg"
                    alt="Portrait of Simon Banyong Millard"
                    class="header-portrait"
                >
                
                <div class="identity">
        
                    <h1 id="name"></h1>
        
                    <p id="profession"></p>
        
                </div>
        
            </div>
        
            <div class="social-links" id="social-links"></div>
        
        </header>


        <!-- NAVIGATION -->

        <nav class="navigation">

            <button class="nav-button active" data-tab="summary">
                <i class="fa-solid fa-user"></i>
                Summary
            </button>

            <button class="nav-button" data-tab="skills">
                <i class="fa-solid fa-code"></i>
                Skills
            </button>

            <button class="nav-button" data-tab="projects">
                <i class="fa-solid fa-gamepad"></i>
                Projects
            </button>

            <button class="nav-button" data-tab="experience">
                <i class="fa-solid fa-briefcase"></i>
                Experience
            </button>

        </nav>


        <!-- MAIN CONTENT -->

        <main id="content"></main>


        <!-- FOOTER -->

        <footer class="footer">

            <div>
                <span class="status-indicator"></span>
                Portfolio / <span id="footer-name"></span>
            </div>

            <div id="footer-year"></div>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
